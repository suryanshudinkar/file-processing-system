spring.application.name=FileProcessingApplication

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

file.upload.path.csv=files/input/csv/
file.upload.path.json=files/input/json/
file.upload.path.xml=files/input/xml/

error.file.path.csv=files/error_reports/csv/
error.file.path.json=files/error_reports/json/
error.file.path.xml=files/error_reports/xml/

file.output.path.csv=files/output/csv/
file.output.path.json=files/output/json/
file.output.path.xml=files/output/xml/

processing.output.path.csv=files/processing_reports/csv/
processing.output.path.json=files/processing_reports/json/
processing.output.path.xml=files/processing_reports/xml/

summary.csv.header=File Name,Total Records,Successful Records,Failed Records,Processing Time (seconds)
error.reports.csv.header=ID,Name,Amount,Currency,Date,Error Message
input.csv.header=id,name,amount,currency,date

output.format.csv=csv
output.format.json=json
output.format.xml=xml